[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rnix"
version = "0.1.0"
description = "Remote NixOS dev shells on Modal sandboxes"
requires-python = ">=3.11"
dependencies = ["modal>=1.6"]

[project.scripts]
rnix = "rnix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a real Modal account"]
addopts = "-m 'not live'"
